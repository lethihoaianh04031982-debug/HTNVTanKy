<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giấy lĩnh &amp; Bảng kê tiền</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9eef5;--g1:#0f3d91;--g2:#13a3a8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--g1:#16306b;--g2:#0e7176;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--g1:#16306b;--g2:#0e7176;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar b{font-size:16px;margin-right:8px}
.bar button{padding:6px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.bar button.on{background:#fff;color:var(--g1);border-color:#fff}
iframe{flex:1;min-height:0;width:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
@media print{.bar{display:none}}
</style>
</head>
<body>
<div class="bar"><b>🏦 Nghiệp vụ</b><button id="t1" class="on">🧾 Giấy lĩnh tiền mặt</button><button id="t3">📥 Giấy nộp tiền</button><button id="t2">💵 Bảng kê tiền</button></div>
<iframe id="f1" title="Giấy lĩnh tiền mặt"></iframe>
<iframe id="f3" title="Giấy nộp tiền" hidden></iframe>
<iframe id="f2" title="Bảng kê tiền" hidden></iframe>
<script type="text/plain" id="a1"><!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giấy lĩnh tiền mặt - VBSP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--panel:#fff;--text:#1d2430;--muted:#5d6675;--line:#d3d8e0;--head:#ffe600;--accent:#c2185b;--ok:#1b7f3b;--err:#c62828;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--panel:#20252c;--text:#e8ebf0;--muted:#9aa4b2;--line:#363d48;--head:#c9b400;--accent:#f06292;--ok:#66bb6a;--err:#ef5350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--panel:#20252c;--text:#e8ebf0;--muted:#9aa4b2;--line:#363d48;--head:#c9b400;--accent:#f06292;--ok:#66bb6a;--err:#ef5350;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{padding:10px;max-width:900px;margin:0 auto}
.panel.form{display:grid;grid-template-columns:1fr 1fr}.src{grid-column:1/-1}.col+.col{border-left:1px solid var(--line)}@media(max-width:640px){.panel.form{grid-template-columns:1fr}.col+.col{border-left:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel h2{margin:0;padding:6px 10px;background:var(--head);color:#111;font-size:13px;text-align:center;text-transform:uppercase}
.fields{padding:8px 10px;display:grid;gap:5px}
.f{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:6px}
.f label{color:var(--muted);font-size:13px;font-weight:600}
select,input[type=text],input[type=number],input[type=date]{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#cmt{font-weight:600}
.msg{font-size:12px;min-height:16px;padding:0 10px 6px}
.ok{color:var(--ok)}.err{color:var(--err)}
.den{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 8px;padding:8px 10px;align-items:center}
.den b{font-size:12px;color:var(--muted)}
.den .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.den .t{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.total{padding:6px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
.actions{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
button,label.btn{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;cursor:pointer;text-align:center}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.src{padding:8px 10px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.src small{color:var(--muted)}
.view{overflow-x:auto;padding:12px}
.panel.pv{position:fixed;left:-9999px;top:0;width:780px;visibility:hidden}
.panel.pv.show{position:static;width:auto;visibility:visible;margin-top:10px}
.slip{width:748px;background:#fff;color:#000;font:13.5px/1.3 "Times New Roman",Times,serif;margin:0 auto;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.s-head{display:grid;grid-template-columns:225px 1fr 180px;align-items:center;padding:6px 6px 2px}
.logo{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:12.5px;text-align:center;line-height:1.2}
.logo img{height:46px;width:auto}
.s-title{text-align:center}
.s-title h1{margin:0;font-size:19px}
.s-title i{font-size:14px}
.sbt{font-size:15px}
.cols{display:grid;grid-template-columns:335px 1fr;border-top:1px solid #000;border-bottom:1px solid #000;margin-top:4px}
.cl{padding:5px 6px 6px;border-right:1px solid #000;display:flex;flex-direction:column;gap:4px}
.cl .gap{height:12px}
.phi{margin-top:14px;display:flex;gap:26px}
.box{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:-2px}
.cr{padding:5px 6px 6px}
.cr h3{margin:14px 0 3px;text-align:center;font-size:13.5px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #000;padding:0 6px;height:19px}
th{font-weight:normal}
td.n{text-align:right}td.c{text-align:center}
tr.tot td{font-weight:bold;height:22px}
.sign{display:grid;grid-template-columns:1fr 1fr 1.2fr;text-align:center;font-weight:bold;padding:10px 6px 64px}
.sign small{font-weight:normal;font-style:italic;font-size:13.5px;display:block}
.bank{border-top:1px solid #000;padding:6px 6px 6px}
.bank .r{display:flex;justify-content:space-between;gap:10px;font-weight:bold;font-size:14.5px;margin-bottom:4px}
.bank .r span:first-child{font-size:12.5px;align-self:flex-end}
.bank .d{font-size:13px;line-height:1.5}
@media print{
@page{size:A4 portrait;margin:6mm 14mm}
html,body{background:#fff;padding:0}
:root{padding:0}
.app{display:block;padding:0}
.panel.form{display:none}
.panel.pv{position:static;width:auto;visibility:visible;border:0;border-radius:0;background:none}
.panel.pv h2{display:none}
.view{padding:0;overflow:visible}
.slip{box-shadow:none;margin:0}
}
</style>
</head>
<body>
<div class="app">
<section class="panel form">
<div class="src">
<button id="link" type="button">📂 Liên kết file Excel (chọn 1 lần)</button>
<label class="btn" for="xl" id="xlb">📂 Chọn file Excel (.xlsx)</label>
<input id="xl" type="file" accept=".xlsx,.xls,.XLSX" hidden>
<small id="srcinfo">Chưa nạp dữ liệu.</small>
<small id="cloudst"></small>
</div>
<div class="col"><h2>Nhập thông tin KH</h2>
<div class="fields">
<div class="f"><label for="cmt">Số CCCD</label><input id="cmt" type="text" inputmode="numeric" autocomplete="off" placeholder="Gõ số CCCD"></div>
<div class="f"><label for="ten">Tên KH</label><input id="ten" type="text"></div>
<div class="f"><label for="ngc">Ngay cap cmt</label><input id="ngc" type="text" placeholder="dd/mm/yyyy"></div>
<div class="f"><label for="noic">Nơi cấp</label><input id="noic" type="text"></div>
<div class="f"><label for="dc">Địa chỉ</label><input id="dc" type="text"></div>
<div class="f"><label for="stk">Số tài khoản</label><div><select id="stk"></select><input id="stkx" type="text" placeholder="Nhập số tài khoản" hidden style="margin-top:4px"></div></div>
<div class="f"><label for="nd">Nội dung</label><select id="nd"><option>Rút tiền từ tài khoản để thanh toán tiền lãi, tiền gửi của tổ viên</option><option>Rút tiền từ tài khoản</option></select></div>
<div class="f"><label for="pgd">PGD</label><input id="pgd" type="text" value="Tân Kỳ"></div>
<div class="f"><label for="ngay">Ngày lập</label><input id="ngay" type="date"></div>
</div>
<div class="msg" id="msg"></div></div>
<div class="col"><h2>Nhập mệnh giá</h2>
<div class="den" id="den"></div>
<div class="total"><span>Tổng cộng</span><span id="sum">0</span></div>
<div class="actions"><button id="clr">Làm mới</button><button id="tg">👁 Xem trước</button><button class="p" id="prt">In giấy lĩnh (1/2 A4)</button></div></div>
</section>
<section class="panel pv">
<h2>Bản xem trước</h2>
<div class="view"><div class="slip" id="slip"></div></div>
</section>
</div>

const out=[];
for(const r of rows.slice(hi+1)){const ma=cell(r[C.ma]);if(!ma)continue;

DEN.forEach(d=>{const n=q[d]||0;t+=n*d;$(`t-${s}-${d}`).textContent=n?fmt(n*d):""});

else{txt=(df>0?"Chi thừa: ":"Chi thiếu: ")+fmt(Math.abs(df));cl+=df>0?" bad":" ok"}}
o.textContent=txt;o.className=cl}
function say(s,m,bad){const t=$("toast-"+s);t.textContent=m;t.style.color=bad?"var(--chi)":"var(--thu)";setTimeout(()=>{if(t.textContent===m)t.textContent=""},4000)}
function clearSide(s){qin(s).forEach(i=>i.value="");$("should-"+s).value="";EDIT[s]=null;$("save-"+s).textContent="Lưu phiếu "+s;calc(s)}
function resetAll(){["name","addr"].forEach(i=>$(i).value="");$("content").value="Trả tiền lãi và TG tổ viên";$("date").value=today();S.forEach(clearSide)}
S.forEach(s=>{
$("save-"+s).onclick=()=>{
const name=$("name").value.trim(),q=getQ(s);
if(!name){say(s,"Hãy nhập tên khách hàng",1);return $("name").focus()}
if(!Object.keys(q).length)return say(s,"Hãy nhập số tờ ít nhất một mệnh giá",1);
const rec={id:EDIT[s]||String(Date.now()),type:s,name,addr:$("addr").value.trim(),content:$("content").value.trim(),date:$("date").value||today(),q,should:shouldVal(s),has:$("should-"+s).value.trim()!=="",ts:Date.now()};
const i=R.findIndex(r=>r.id===rec.id);if(i>=0)R[i]=rec;else R.push(rec);
if(!store())return say(s,"Không lưu được vào trình duyệt",1);
say(s,"Đã lưu "+fmt(total(q))+" đ cho "+name);clearSide(s);refreshList()};
$("should-"+s).addEventListener("input",e=>{const v=e.target.value.replace(/\D/g,"");e.target.value=v?fmt(+v):"";calc(s)});
$("should-"+s).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const n=s==="thu"?qin("chi")[0]:$("saveboth");n.focus();n.select&&n.select()}});
qin(s).forEach((el,i,a)=>{el.addEventListener("input",()=>calc(s));
el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const n=a[i+1]||$("should-"+s);n.focus();n.select&&n.select()}})})});
$("clr").onclick=()=>{resetAll();$("name").focus()};
$("saveboth").onclick=()=>{const act=S.filter(s=>Object.keys(getQ(s)).length);
if(!$("name").value.trim()){say("thu","Hãy nhập tên khách hàng",1);return $("name").focus()}
if(!act.length)return say("thu","Hãy nhập số tờ ít nhất một mệnh giá",1);
act.forEach(s=>$("save-"+s).click());$("name").focus()};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&!$("p-nhap").hidden){e.preventDefault();$("saveboth").click()}});
/* ---- In bảng kê tiền thu (giấy A5 dọc) ---- */
const DW=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function w3(n,full){const h=Math.floor(n/100),t=Math.floor(n%100/10),u=n%10,s=[];
if(h>0||full)s.push(DW[h],"trăm");
if(t>1){s.push(DW[t],"mươi");s.push(u==1?"mốt":u==5?"lăm":u?DW[u]:"")}
else if(t==1){s.push("mười");s.push(u==5?"lăm":u?DW[u]:"")}
else if(u>0){if(h>0||full)s.push("linh");s.push(DW[u])}
return s.filter(Boolean).join(" ")}
function words(n){if(!n)return"Không đồng";const U=["","nghìn","triệu","tỷ"],g=[];let x=n;
while(x>0){g.push(x%1000);x=Math.floor(x/1000)}
const o=[];let st=false;
for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;o.push(w3(g[i],st),U[i]);st=true}
const s=o.filter(Boolean).join(" ");return s[0].toUpperCase()+s.slice(1)+" đồng"}
function preparePK(){
const ins=qin("thu");let sum=0,rows="";
DEN.forEach(d=>{const inp=ins.find(i=>+i.dataset.d===d),raw=inp?inp.value.trim():"",n=parseInt(raw)||0;sum+=n*d;
rows+=`<tr><td class="r">${fmt(d)}</td><td class="c">${raw!==""?n:""}</td><td class="r">${n>0?fmt(n*d):""}</td></tr>`});
if(!sum){say("thu","Hãy nhập số tờ ít nhất một mệnh giá để in",1);return false}
const dv=($("date").value||today()).split("-"),dt=`Ngày ${dv[2]} tháng ${dv[1]} năm ${dv[0]}`;
$("pk").innerHTML=`<div class="h"><div class="b">NHCSXH<br>PGD TÂN KỲ</div><div class="t"><h1>BẢNG KÊ CÁC LOẠI TIỀN NỘP <span>Số…..</span></h1><div class="d">${dt}</div></div></div>
<div class="ii"><div>Họ và tên người nộp tiền: ${esc($("name").value.trim())}</div><div>Địa chỉ: ${esc($("addr").value.trim())}</div><div>Nội dung nộp tiền:${esc($("content").value.trim())}</div></div>
<table><colgroup><col style="width:30%"><col style="width:28%"><col style="width:42%"></colgroup><tr><th>Loại tiền</th><th>Số tờ</th><th>Thành tiền (đ)</th></tr>${rows}
<tr class="tot"><td>Tổng cộng</td><td></td><td class="r">${fmt(sum)}</td></tr>
<tr><td class="bc" colspan="3">Bằng chữ: ${words(sum)}</td></tr></table>
<div class="sg"><div>NGƯỜI NỘP TIỀN<small>(Ký tên)</small></div><div>NGƯỜI THU TIỀN<small>(Ký tên)</small></div></div>`;
document.body.dataset.job="bk";
const st=document.createElement("style");st.id="pgst";st.textContent="@page{size:A5 portrait;margin:8mm}";document.head.appendChild(st);
const k=$("pk");k.style.zoom=1;k.style.zoom=Math.min(1,(148-16)/25.4*96/k.offsetWidth,(210-16)/25.4*96/k.offsetHeight);
return true}
function endPK(){delete document.body.dataset.job;const s=$("pgst");if(s)s.remove();$("pk").style.zoom=1}
$("print-thu").onclick=()=>{if(preparePK())window.print()};
window.addEventListener("afterprint",endPK);
/* Enter: Người nộp tiền → Địa chỉ → Nội dung → Ngày → bảng thu */
const chain=["name","addr","content","date"];
chain.forEach((id,i)=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const n=i<3?$(chain[i+1]):qin("thu")[0];n.focus();n.select&&n.select()}}));
function refreshList(){const m=new Map();R.forEach(r=>{const k=ck(r);if(!m.has(k))m.set(k,r)});
$("cl").innerHTML=[...m.values()].map(c=>`<option value="${esc(c.name)}">${esc(c.addr)}</option>`).join("")}
$("name").addEventListener("change",()=>{if($("addr").value.trim())return;const n=$("name").value.trim().toLowerCase();const r=[...R].reverse().find(x=>x.name.trim().toLowerCase()===n);if(r)$("addr").value=r.addr});
/* ---- Tổng hợp ---- */
function agg(rs){const T={};DEN.forEach(d=>T[d]={thu:0,chi:0});let back=0;
rs.forEach(r=>{DEN.forEach(d=>{T[d][r.type]+=r.q[d]||0});back+=back1(r)});return{T,back}}
function tbl(a,full){
let h=`<thead><tr><th rowspan="2">Loại tiền</th><th colspan="2">Thu</th><th colspan="2">Chi</th><th colspan="2">Chênh lệch (thu − chi)</th></tr><tr><th>Số tờ</th><th>Thành tiền</th><th>Số tờ</th><th>Thành tiền</th><th>Số tờ</th><th>Thành tiền</th></tr></thead><tbody>`;
let nt=0,nc=0,st=0,sc=a.back;
DEN.forEach(d=>{const x=a.T[d];nt+=x.thu;nc+=x.chi;st+=x.thu*d;sc+=x.chi*d;
if(!full&&!x.thu&&!x.chi)return;
const df=x.thu-x.chi;
h+=`<tr><td class="c">${fmt(d)}</td><td class="n">${x.thu||""}</td><td class="n">${x.thu?fmt(x.thu*d):""}</td><td class="n">${x.chi||""}</td><td class="n">${x.chi?fmt(x.chi*d):""}</td><td class="n">${df||""}</td><td class="n">${df?fmt(df*d):""}</td></tr>`});
if(a.back>0)h+=`<tr><td class="c">Trả KH (thu dư)</td><td></td><td></td><td></td><td class="n">${fmt(a.back)}</td><td></td><td class="n">${fmt(-a.back)}</td></tr>`;
return h+`</tbody><tfoot><tr><td class="c">Cộng tổng</td><td class="n">${nt}</td><td class="n thu-c">${fmt(st)}</td><td class="n">${nc}</td><td class="n chi-c">${fmt(sc)}</td><td class="n">${nt-nc}</td><td class="n">${fmt(st-sc)}</td></tr></tfoot>`}
function recHTML(r){const ex=back1(r);
return `<div class="rec"><b class="${r.type==="thu"?"thu-c":"chi-c"}">${r.type==="thu"?"THU":"CHI"}</b><span>${dmy(r.date)}</span><span class="g">${esc(r.content)}</span><b>${fmt(total(r.q))}</b>${ex?`<span class="chi-c">trả KH ${fmt(ex)}</span>`:""}<button class="btn" data-o="${r.id}">Mở</button><button class="btn" data-x="${r.id}">Xóa</button></div>`}
function renderTH(){
const a=$("d1").value,b=$("d2").value,rs=R.filter(r=>(!a||r.date>=a)&&(!b||r.date<=b));
$("sumall").innerHTML=tbl(agg(rs),true);

}
["d1","d2"].forEach(i=>$(i).addEventListener("input",renderTH));
$("dall").onclick=()=>{$("d1").value=$("d2").value="";renderTH()};
$("dtd").onclick=()=>{$("d1").value=$("d2").value=today();renderTH()};
$("prt").onclick=()=>window.print();
function arm(b,label,fn){if(b.dataset.arm){delete b.dataset.arm;fn()}else{b.dataset.arm=1;const old=b.textContent;b.textContent=label;b.classList.add("arm");setTimeout(()=>{if(b.isConnected&&b.dataset.arm){delete b.dataset.arm;b.textContent=old;b.classList.remove("arm")}},3500)}}
$("wipe").onclick=e=>arm(e.currentTarget,"Bấm lại để xóa TOÀN BỘ",()=>{R=[];store();refreshList();renderTH();const b=$("wipe");b.textContent="🗑 Xóa toàn bộ";b.classList.remove("arm")});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.o){const r=R.find(x=>x.id===b.dataset.o);if(!r)return;const s=r.type;
$("name").value=r.name;$("addr").value=r.addr;$("content").value=r.content;$("date").value=r.date;
clearSide(s);qin(s).forEach(i=>i.value=r.q[i.dataset.d]||"");$("should-"+s).value=r.has?fmt(r.should):"";
EDIT[s]=r.id;$("save-"+s).textContent="Cập nhật phiếu "+s;calc(s);show("nhap")}
else if(b.dataset.x)arm(b,"Bấm lại để xóa",()=>{R=R.filter(x=>x.id!==b.dataset.x);store();refreshList();renderTH();renderKH();if(MOD)openMod(MOD)})});
/* ---- Khách hàng (từ bảng kê Thu) ---- */
let MOD=null,KLIST=[];
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase();
const inK=r=>{const a=$("k1").value,b=$("k2").value;return(!a||r.date>=a)&&(!b||r.date<=b)};
function renderKH(){

const m=new Map();
R.filter(r=>r.type==="thu"&&inK(r)&&(!qs||norm(r.name+" "+r.addr).includes(qs))).forEach(r=>{const k=ck(r);if(!m.has(k))m.set(k,{k,name:r.name,addr:r.addr,thu:0,chi:0});const c=m.get(k);c.thu+=total(r.q);c.chi+=back1(r)});

KLIST=list;let T=0,C=0;
$("ktbl").innerHTML=`<thead><tr><th>STT</th><th>Khách hàng</th><th>Địa chỉ</th><th>Thu</th><th>Chi</th><th class="noprint">Thao tác</th></tr></thead><tbody>`+(list.length?list.map((c,i)=>{T+=c.thu;C+=c.chi;return `<tr><td class="c">${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.addr)}</td><td class="n">${fmt(c.thu)}</td><td class="n">${fmt(c.chi)}</td><td class="c noprint"><button class="btn" data-v="${esc(c.k)}">Xem</button> <button class="btn" data-k="${esc(c.k)}">Xóa</button></td></tr>`}).join(""):`<tr><td colspan="6" class="muted c">Chưa có dữ liệu trong khoảng này.</td></tr>`)+`</tbody><tfoot><tr><td colspan="3" class="c">Cộng tổng</td><td class="n thu-c">${fmt(T)}</td><td class="n chi-c">${fmt(C)}</td><td class="noprint"></td></tr></tfoot>`}
function resTxt(s,df,has){if(!has)return"—";if(df===0)return"Đủ";const a=fmt(Math.abs(df));return s==="thu"?(df>0?"Trả KH: ":"Thu thêm: ")+a:(df>0?"Chi thừa: ":"Chi thiếu: ")+a}
function sheetHTML(r){const L2=LB[r.type],t=total(r.q);
return `<div class="vs ${r.type}"><div class="vh"><b class="${r.type==="thu"?"thu-c":"chi-c"}">${r.type==="thu"?"THU":"CHI"}</b> · ${dmy(r.date)}</div><div>Người nộp tiền: <b>${esc(r.name)}</b></div><div>Địa chỉ: ${esc(r.addr)}</div><div>Nội dung: ${esc(r.content)}</div>
<table><thead><tr><th>Loại tiền</th><th>Số tờ</th><th>Thành tiền (đ)</th></tr></thead><tbody>${DEN.map(d=>`<tr><td class="c">${fmt(d)}</td><td class="c">${r.q[d]||""}</td><td class="n">${r.q[d]?fmt(r.q[d]*d):""}</td></tr>`).join("")}</tbody><tfoot><tr><td class="c">${L2.a}</td><td></td><td class="n">${fmt(t)}</td></tr><tr><td class="c">${L2.b}</td><td></td><td class="n">${r.has?fmt(r.should):""}</td></tr><tr><td class="c">${L2.c}</td><td></td><td class="n">${resTxt(r.type,t-r.should,r.has)}</td></tr></tfoot></table>
<div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" data-o="${r.id}">Mở</button><button class="btn" data-x="${r.id}">Xóa</button></div></div>`}
function openMod(k){MOD=k;const rs=R.filter(r=>ck(r)===k&&inK(r));
if(!rs.length)return closeMod();
$("m-t").textContent=rs[0].name;$("m-a").textContent=rs[0].addr;

$("m-recs").innerHTML=`<div class="vg">`+rs.slice().sort((x,y)=>x.type===y.type?x.ts-y.ts:(x.type==="thu"?-1:1)).map(sheetHTML).join("")+`</div>`;
$("modal").hidden=false}
function closeMod(){MOD=null;$("modal").hidden=true}

["ksel","k1","k2"].forEach(i=>{$(i).addEventListener("input",renderKH);$(i).addEventListener("change",renderKH)});

arm(b,"Bấm lại: xóa "+ids.length+" phiếu",()=>{R=R.filter(r=>!ids.includes(r.id));store();refreshList();renderKH();b.textContent="🗑 Xóa tất cả";b.classList.remove("arm")})};
$("ktbl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.v)return openMod(b.dataset.v);

function show(t){closeMod();["nhap","kh","th"].forEach(k=>{$("p-"+k).hidden=k!==t;$("b-"+k).className=k===t?"on":""});
if(t==="kh")renderKH();if(t==="th")renderTH();window.scrollTo(0,0)}
$("b-nhap").onclick=()=>show("nhap");$("b-th").onclick=()=>show("th");$("b-kh").onclick=()=>show("kh");
$("date").value=today();$("k1").value=$("k2").value=today();refreshList();S.forEach(calc);

const M=[500000,200000,100000,50000,20000,10000,5000,2000,1000,500,200,100];
const $=id=>document.getElementById(id);
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/\s+/g," ").trim();
let DB=[],FOUND=false,LOCALAT=0;const KEY="vbsp_nt_v1";
$("ngay").value=new Date().toISOString().slice(0,10);
$("den").innerHTML="<b>Mệnh giá</b><b>Số lượng</b><b style='text-align:right'>Thành tiền</b>"+M.map(m=>`<span class="v">${fmt(m)}</span><input id="q${m}" type="number" min="0" inputmode="numeric"><span class="t" id="t${m}"></span>`).join("");
const D=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function three(n,full){const h=Math.floor(n/100),t=Math.floor(n%100/10),u=n%10,s=[];
if(h>0||full)s.push(D[h],"trăm");
if(t>1){s.push(D[t],"mươi");s.push(u==1?"mốt":u==5?"lăm":u?D[u]:"")}
else if(t==1){s.push("mười");s.push(u==5?"lăm":u?D[u]:"")}
else if(u>0){if(h>0||full)s.push("linh");s.push(D[u])}
return s.filter(Boolean).join(" ")}
function words(n){if(!n)return"Không đồng.";const U=["","nghìn","triệu","tỷ"],g=[];let x=n;
while(x>0){g.push(x%1000);x=Math.floor(x/1000)}
const o=[];let st=false;
for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;o.push(three(g[i],st),U[i]);st=true}
const s=o.filter(Boolean).join(" ");return s[0].toUpperCase()+s.slice(1)+" đồng."}
/* ---- Dữ liệu khách hàng từ Excel ---- */
const fromRows=rs=>rs.map(r=>({ma:r[0],ten:r[1],thon:r[2],xa:r[3],stk:r[4],cmt:r[5],ngc:r[6],sdt:r[7]||""}));
function cell(v){if(v instanceof Date){const d=new Date(v.getTime()+12*3600e3);return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear()}return v==null?"":String(v).trim()}
function parseSheet(buf){
if(typeof XLSX==="undefined")throw new Error("không tải được thư viện đọc Excel (cdnjs.cloudflare.com), hãy kiểm tra mạng");
const wb=XLSX.read(buf,{type:"array",cellDates:true});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
const hi=rows.findIndex(r=>r.some(c=>norm(c)==="ma kh"));
if(hi<0)throw new Error("Không thấy cột Mã KH");
const h=rows[hi].map(norm),col=n=>h.indexOf(n);
const C={ma:col("ma kh"),ten:col("ten kh"),thon:col("thon, ban"),xa:col("xa, phuong"),stk:col("so tai khoan"),cmt:col("cmt"),ngc:col("ngay cap cmt"),sdt:col("so dien thoai")};
const out=[];
for(const r of rows.slice(hi+1)){const ma=cell(r[C.ma]);if(!ma)continue;
out.push({ma,ten:cell(r[C.ten]),thon:cell(r[C.thon]),xa:cell(r[C.xa]),stk:cell(r[C.stk]),cmt:cell(r[C.cmt]),ngc:cell(r[C.ngc]),sdt:C.sdt>=0?cell(r[C.sdt]):""})}
return out}
function setDB(db,name,at){DB=db;LOCALAT=at||Date.now();
$("srcinfo").textContent=`Đã nạp ${db.length} khách hàng${name?" từ "+name:""}.`;
try{localStorage.setItem(KEY,JSON.stringify({db,name,at:LOCALAT}))}catch(e){}}
async function loadFile(f){try{setDB(parseSheet(await f.arrayBuffer()),f.name);lookup()}catch(err){$("srcinfo").textContent="Lỗi đọc file: "+err.message}}
$("xl").addEventListener("change",async e=>{const f=e.target.files[0];if(f)await loadFile(f);e.target.value=""});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f)});
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.db))setDB(s.db,s.name,s.at)}catch(e){}
if(EMBED&&EMBED.at>LOCALAT){setDB(fromRows(EMBED.rows),EMBED.name,EMBED.at);$("srcinfo").textContent+=" (dữ liệu có sẵn trong trang)"}
/* ---- Tra cứu theo số CCCD ---- */
function diaChi(r){let t=r.thon.trim(),x=r.xa.trim();
if(t&&!/^(xóm|thôn|bản|khối|tổ|phố)\b/i.test(t))t="Xóm "+t;
if(x)x=x[0].toLowerCase()+x.slice(1);
return[t,x,"tỉnh Nghệ An"].filter(Boolean).join(", ")}
const getStk=()=>$("stk").value==="__x"?$("stkx").value.trim():$("stk").value;
function setStk(list){const s=$("stk");
s.innerHTML=list.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("")+`<option value="__x">Nhập số khác…</option>`;
s.value=list.length?list[0]:"__x";$("stkx").hidden=s.value!=="__x"}
$("stk").addEventListener("change",()=>{$("stkx").hidden=$("stk").value!=="__x";render()});
function lookup(){const k=$("cmt").value.trim(),ms=k?DB.filter(x=>x.cmt===k):[],r=ms[0],m=$("msg");FOUND=!!r;
if(r){$("ten").value=r.ten;$("ngc").value=r.ngc;$("dc").value=diaChi(r);$("sdt").value=r.sdt;
setStk([...new Set(ms.map(x=>x.stk).filter(Boolean))]);
m.textContent="✓ Đã tìm thấy khách hàng"+(ms.length>1?" ("+ms.length+" dòng dữ liệu)":"");m.className="msg ok"}
else{["ten","ngc","dc","sdt","stkx"].forEach(i=>$(i).value="");setStk([]);
m.textContent=k?(DB.length?"Không tìm thấy số CCCD này":"Hãy chọn file Excel trước"):"";m.className="msg err"}
render()}
$("cmt").addEventListener("input",lookup);
$("khac").addEventListener("change",()=>{$("nn").hidden=!$("khac").checked;render()});
/* ---- Giấy nộp tiền ---- */
function dateVN(v){const d=v?v.split("-"):[];return d.length==3?`Ngày ${+d[2]} tháng ${+d[1]} năm ${d[0]}`:"Ngày …… tháng …… năm ……"}
function render(){
const g=id=>esc($(id).value.trim());
let sum=0;const rows=[];
M.forEach(m=>{const q=Math.max(0,parseInt($("q"+m).value)||0),t=q*m;$("t"+m).textContent=q?fmt(t):"";
if(q){sum+=t;rows.push(`<tr><td>${fmt(m)}</td><td>${q}</td><td class="n">${fmt(t)}</td></tr>`)}});
while(rows.length<10)rows.push("<tr><td>&nbsp;</td><td></td><td></td></tr>");
$("sum").textContent=fmt(sum);const sf=sum?fmt(sum)+" đồng":"";
const k=$("khac").checked,nn={n:k?g("nten"):g("ten"),c:k?g("ncmt"):g("cmt"),d:k?g("nngc"):g("ngc")};
const stk=esc(getStk()),lh=g("sdt")||g("dc"),dot=x=>x?x+".":"";
$("slip").innerHTML=`
<div class="sh">
<div class="logo"><img src="${LOGO}" alt="VBSP"><div>NGÂN HÀNG<br>CHÍNH SÁCH XÃ HỘI<br><span class="pg">PGD: ${g("pgd")}</span></div></div>
<div class="tt"><h1>GIẤY NỘP TIỀN</h1><i>${dateVN($("ngay").value)}</i></div>
<div class="sb">Số bút toán:……..</div></div>
<div class="mn">
<div class="l">
<div class="sec"><div class="st">NGƯỜI NỘP TIỀN</div><div>Họ và tên: ${nn.n}</div><div>CCCD: ${dot(nn.c)} Cấp ngày: ${nn.d}</div></div>
<div class="sec"><div class="st">BÊN THỤ HƯỞNG</div><div>Tên ĐV/Cá nhân hưởng: ${g("ten")}</div><div>CCCD: ${dot(g("cmt"))} Cấp ngày: ${g("ngc")}</div><div>Số tài khoản: ${stk}</div><div>Tại Ngân hàng ${g("nh")}</div><div>Địa chỉ/Điện thoại: ${lh}</div></div>
<div class="sec"><div class="st">NỘI DUNG</div><div class="it">${g("nd")}</div>
<div class="nh"><b>DÀNH CHO NGÂN HÀNG</b><div>Số tiền ${sf}</div><div>TK ghi nợ: ${g("tkn")}</div><div>TK ghi có: ${stk}</div></div></div>
</div>
<div class="r"><div class="st">SỐ TIỀN</div><div>Bằng số: ${sf}</div><div class="it">Bằng chữ: ${sum?words(sum):""}</div>
<div class="phi"><span>Phí NH:</span><span>Phí trong <span class="box"></span></span><span>Phí ngoài <span class="box"></span></span></div>
<div class="cap">BẢNG KÊ CÁC LOẠI TIỀN NỘP</div>
<table class="tb"><tr><th>Mệnh giá</th><th>Số lượng</th><th>Thành tiền</th></tr>${rows.join("")}
<tr class="tot"><td>Tổng cộng</td><td></td><td class="n">${sum?fmt(sum):""}</td></tr></table>
</div></div>
<div class="ft"><div>NGƯỜI NỘP TIỀN<small>(Ký, ghi rõ họ tên)</small></div><div>GIAO DỊCH VIÊN</div><div>THỦ QUỸ</div><div>KIỂM SOÁT</div><div>GIÁM ĐỐC</div></div>`}
document.querySelectorAll(".fields input,.den input").forEach(i=>{if(i.id!=="cmt"&&i.id!=="khac")i.addEventListener("input",render)});
/* ---- Enter chuyển ô ---- */
const NX={ten:"ngc",ngc:"dc",dc:"sdt",nten:"ncmt",ncmt:"nngc",nngc:"nd",nd:"q500000"};
function goNext(id){let n=NX[id];
if(id==="cmt")n=FOUND?"stk":"ten";
if(id==="sdt")n="stk";
if(id==="stk"||id==="stkx")n=$("khac").checked?"nten":"nd";
if(id==="stk"&&$("stk").value==="__x")n="stkx";
const el=$(n);el.focus();el.select&&el.select()}
["cmt","ten","ngc","dc","sdt","stk","stkx","nten","ncmt","nngc","nd"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();goNext(id)}}));
const qs=[...document.querySelectorAll(".den input")];
qs.forEach((el,i)=>el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const nx=qs[i+1];if(nx){nx.focus();nx.select()}else $("prt").focus()}}));
$("clr").onclick=()=>{$("cmt").value="";qs.forEach(i=>i.value="");$("khac").checked=false;$("nn").hidden=true;["nten","ncmt","nngc"].forEach(i=>$(i).value="");$("nd").value="Nộp tiền vào TK";lookup();$("cmt").focus()};
$("tg").onclick=()=>{const s=$("pv").classList.toggle("show");$("tg").textContent=s?"🙈 Ẩn xem trước":"👁 Xem trước"};
/* ---- In vừa nửa tờ A4 dọc (lề 14 mm trái/phải) ---- */
function fit(){const s=$("slip");s.style.zoom=1;
const tw=(210-28)/25.4*96,th=(148.5-6)/25.4*96;
s.style.zoom=Math.min(tw/s.offsetWidth,th/s.offsetHeight,1.4)}
window.addEventListener("beforeprint",fit);
window.addEventListener("afterprint",()=>{$("slip").style.zoom=1});
$("prt").onclick=()=>window.print();
setStk([]);render();

<script>
const dec=id=>document.getElementById(id).textContent.replace(/<\\\/script>/g,"<"+"/script>");
const F=["f1","f3","f2"],T=["t1","t3","t2"];
function show(i){F.forEach((f,k)=>{document.getElementById(f).hidden=k!==i;document.getElementById(T[k]).className=k===i?"on":""});
try{localStorage.setItem("shell_tab2",String(i))}catch(e){}}
T.forEach((t,i)=>document.getElementById(t).onclick=()=>show(i));
document.getElementById("f1").srcdoc=dec("a1");
document.getElementById("f2").srcdoc=dec("a2");
document.getElementById("f3").srcdoc=dec("a3");
let s=0;try{s=+localStorage.getItem("shell_tab2")||0}catch(e){}
show(s>=0&&s<3?s:0);
</script>
